# Four identical QASS services, one per machine. Only the health port,
# log file name and config file differ. Shared settings live in the
# x-qass-service anchor below; `<<: *qass-service` merges them in.
#
# Deploy / update:   docker compose up -d --build
# One machine only:  docker compose up -d --build qass-machine4

x-qass-service: &qass-service
  image: qass-service:13.0
  restart: always
  network_mode: host
  volumes:
    - qass_state:/app/state
    - qass_logs:/app/logs

services:
  qass-machine1:
    <<: *qass-service
    environment:
      HEALTH_PORT: 8081
      QASS_LOG_FILE: qass_machine1.log
    command: ["python3", "main.py", "configs/config_machine1.yaml"]

  qass-machine2:
    <<: *qass-service
    environment:
      HEALTH_PORT: 8082
      QASS_LOG_FILE: qass_machine2.log
    command: ["python3", "main.py", "configs/config_machine2.yaml"]

  qass-machine3:
    <<: *qass-service
    environment:
      HEALTH_PORT: 8083
      QASS_LOG_FILE: qass_machine3.log
    command: ["python3", "main.py", "configs/config_machine3.yaml"]

  qass-machine4:
    <<: *qass-service
    environment:
      HEALTH_PORT: 8084
      QASS_LOG_FILE: qass_machine4.log
    command: ["python3", "main.py", "configs/config_machine4.yaml"]

volumes:
  qass_state:
  qass_logs:
