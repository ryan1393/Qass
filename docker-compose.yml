    restart: always
    network_mode: host
    environment:
      HEALTH_PORT: 8084
      QASS_LOG_FILE: qass_machine4.log
    command: ["python3", "main.py", "configs/config_machine4.yaml"]
    volumes:
      - qass_state:/app/state
      - qass_logs:/app/logs

volumes:
  qass_state:
  qass_logs: