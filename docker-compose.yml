version: "3.9"

services:
  qass-machine1:
    image: qass-service:13.0
    restart: always
    network_mode: host
    environment:
      HEALTH_PORT: 8081
      QASS_LOG_FILE: qass_machine1.log
    command: ["python3", "main.py", "configs/config_machine1.yaml"]
    volumes:
      - qass_state:/app/state
      - qass_logs:/app/logs

  qass-machine2:
    image: qass-service:13.0
    restart: always
    network_mode: host
    environment:
      HEALTH_PORT: 8082
      QASS_LOG_FILE: qass_machine2.log
    command: ["python3", "main.py", "configs/config_machine2.yaml"]
    volumes:
      - qass_state:/app/state
      - qass_logs:/app/logs

  qass-machine3:
    image: qass-service:13.0
    restart: always
    network_mode: host
    environment:
      HEALTH_PORT: 8083
      QASS_LOG_FILE: qass_machine3.log
    command: ["python3", "main.py", "configs/config_machine3.yaml"]
    volumes:
      - qass_state:/app/state
      - qass_logs:/app/logs

  qass-machine4:
